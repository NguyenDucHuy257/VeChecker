[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "dktle"
version = "0.1.0"
description = "Tra cuu phuong tien app.vr.org.vn - Phase 1"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4==4.15.0",
    "requests==2.34.2",
]

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"app.migrations" = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
