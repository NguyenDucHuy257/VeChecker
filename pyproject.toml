[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "dktle"
version = "0.2.0"
description = "Tra cuu phuong tien app.vr.org.vn qua Telegram"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4==4.15.0",
    "numpy==2.4.6",
    "onnxruntime==1.28.0",
    "Pillow==12.3.0",
    "requests==2.34.2",
]

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
]
train = [
    "torch>=2.7,<3",
    "torchvision>=0.22,<1",
    "onnx>=1.18,<2",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"app.migrations" = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
